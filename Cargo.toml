[workspace]
resolver = "2"
members = [
  "crates/shared",
  "crates/core",
  "packages/connectors/futu",
  "packages/strategies",
  "packages/models",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/trade-robot"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
hex = "0.4"
keyring = "2"
once_cell = "1"
parking_lot = "0.12"
proptest = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-rusqlite = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
